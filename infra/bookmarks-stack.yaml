AWSTemplateFormatVersion: '2010-09-09'
Description: Bookmark sync infrastructure -- DynamoDB, Lambda, HTTP API with Cognito JWT auth

Parameters:
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_7z1XPo7l5
  CognitoAppClientId:
    Type: String
    Default: 540mtl0k1t0h8qppra643u6qvu

Resources:

  ArticleSummariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: newsapp-article-summaries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: articleId
          AttributeType: S
      KeySchema:
        - AttributeName: articleId
          KeyType: HASH

  BookmarksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: articleId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: articleId
          KeyType: RANGE

  FollowedCategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: newsapp-followed-categories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: categoryId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: categoryId
          KeyType: RANGE

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt BookmarksTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt FollowedCategoriesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ArticleSummariesTable.Arn

  GetBookmarksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-getBookmarks
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref BookmarksTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { QueryCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const result = await client.send(new QueryCommand({
              TableName: process.env.TABLE_NAME,
              KeyConditionExpression: "userId = :uid",
              ExpressionAttributeValues: { ":uid": userId }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ bookmarks: result.Items })
            };
          };

  AddBookmarkFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-addBookmark
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref BookmarksTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { PutCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const body = JSON.parse(event.body);
            await client.send(new PutCommand({
              TableName: process.env.TABLE_NAME,
              Item: { userId, ...body }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ success: true })
            };
          };

  RemoveBookmarkFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-removeBookmark
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref BookmarksTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { DeleteCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const articleId = event.pathParameters.articleId;
            await client.send(new DeleteCommand({
              TableName: process.env.TABLE_NAME,
              Key: { userId, articleId }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ success: true })
            };
          };

  BookmarkApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: newsapp-bookmarks-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowOrigins:
          - '*'

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref BookmarkApi
      AuthorizerType: JWT
      Name: CognitoJwtAuthorizer
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref CognitoAppClientId
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}

  GetBookmarksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetBookmarksFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  AddBookmarkIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AddBookmarkFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  RemoveBookmarkIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RemoveBookmarkFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  GetBookmarksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: GET /bookmarks
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${GetBookmarksIntegration}

  AddBookmarkRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: POST /bookmarks
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${AddBookmarkIntegration}

  RemoveBookmarkRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: DELETE /bookmarks/{articleId}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${RemoveBookmarkIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BookmarkApi
      StageName: '$default'
      AutoDeploy: true

  GetFollowedCategoriesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-getFollowedCategories
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CATEGORIES_TABLE_NAME: !Ref FollowedCategoriesTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { QueryCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const result = await client.send(new QueryCommand({
              TableName: process.env.CATEGORIES_TABLE_NAME,
              KeyConditionExpression: "userId = :uid",
              ExpressionAttributeValues: { ":uid": userId }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ categories: result.Items })
            };
          };

  AddFollowedCategoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-addFollowedCategory
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CATEGORIES_TABLE_NAME: !Ref FollowedCategoriesTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { PutCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const body = JSON.parse(event.body);
            await client.send(new PutCommand({
              TableName: process.env.CATEGORIES_TABLE_NAME,
              Item: { userId, ...body }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ success: true })
            };
          };

  RemoveFollowedCategoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-removeFollowedCategory
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CATEGORIES_TABLE_NAME: !Ref FollowedCategoriesTable
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { DeleteCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const client = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const userId = event.requestContext.authorizer.jwt.claims.sub;
            const categoryId = event.pathParameters.categoryId;
            await client.send(new DeleteCommand({
              TableName: process.env.CATEGORIES_TABLE_NAME,
              Key: { userId, categoryId }
            }));
            return {
              statusCode: 200,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ success: true })
            };
          };

  GetFollowedCategoriesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetFollowedCategoriesFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  AddFollowedCategoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AddFollowedCategoryFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  RemoveFollowedCategoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RemoveFollowedCategoryFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  GetFollowedCategoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: GET /followed-categories
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${GetFollowedCategoriesIntegration}

  AddFollowedCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: POST /followed-categories
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${AddFollowedCategoryIntegration}

  RemoveFollowedCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: DELETE /followed-categories/{categoryId}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${RemoveFollowedCategoryIntegration}

  GetFollowedCategoriesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetFollowedCategoriesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/followed-categories

  AddFollowedCategoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddFollowedCategoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/followed-categories

  RemoveFollowedCategoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemoveFollowedCategoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/followed-categories/*

  GetBookmarksPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetBookmarksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/bookmarks

  AddBookmarkPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddBookmarkFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/bookmarks

  RemoveBookmarkPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemoveBookmarkFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/bookmarks/*

  GetArticleSummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: newsapp-getArticleSummary
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 29
      Environment:
        Variables:
          SUMMARIES_TABLE_NAME: !Ref ArticleSummariesTable
          OPENAI_API_KEY: REPLACE_WITH_YOUR_KEY
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { GetCommand, PutCommand, DynamoDBDocumentClient } = require("@aws-sdk/lib-dynamodb");
          const db = DynamoDBDocumentClient.from(new DynamoDBClient({}));

          exports.handler = async (event) => {
            const { articleId, articleUrl } = event.queryStringParameters || {};
            if (!articleId || !articleUrl) {
              return { statusCode: 400, body: JSON.stringify({ error: "Missing articleId or articleUrl" }) };
            }

            try {
              const cached = await db.send(new GetCommand({
                TableName: process.env.SUMMARIES_TABLE_NAME,
                Key: { articleId }
              }));
              if (cached.Item?.summaryPoints) {
                return { statusCode: 200, body: JSON.stringify({ articleId, summaryPoints: cached.Item.summaryPoints }) };
              }

              let articleText = "";
              try {
                const res = await fetch(articleUrl, {
                  headers: { "User-Agent": "Mozilla/5.0 (compatible; NewsApp/1.0)" },
                  signal: AbortSignal.timeout(8000)
                });
                const html = await res.text();
                articleText = html.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 4000);
              } catch (fetchErr) {
                console.warn("Article fetch failed:", fetchErr.message);
              }

              const prompt = articleText.length > 100
                ? articleText
                : `Article URL: ${articleUrl}`;

              const openAiRes = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-4o-mini",
                  max_tokens: 300,
                  temperature: 0.3,
                  messages: [
                    {
                      role: "system",
                      content: "Summarize the following news article in exactly 3 concise bullet points. Return only a JSON array of 3 strings. No markdown, no extra text."
                    },
                    { role: "user", content: prompt }
                  ]
                }),
                signal: AbortSignal.timeout(20000)
              });

              const aiData = await openAiRes.json();
              const raw = aiData.choices?.[0]?.message?.content ?? "";

              let summaryPoints;
              try {
                const parsed = JSON.parse(raw);
                summaryPoints = Array.isArray(parsed) ? parsed.slice(0, 3) : [raw];
              } catch {
                summaryPoints = raw.split("\n").map(l => l.replace(/^[-•*\d.]+\s*/, "").trim()).filter(Boolean).slice(0, 3);
              }

              if (summaryPoints.length === 0) {
                return { statusCode: 500, body: JSON.stringify({ error: "Failed to generate summary" }) };
              }

              await db.send(new PutCommand({
                TableName: process.env.SUMMARIES_TABLE_NAME,
                Item: { articleId, summaryPoints, generatedAt: Date.now() }
              }));

              return { statusCode: 200, body: JSON.stringify({ articleId, summaryPoints }) };
            } catch (err) {
              console.error("Summary generation error:", err);
              return { statusCode: 500, body: JSON.stringify({ error: err.message }) };
            }
          };

  GetArticleSummaryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BookmarkApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetArticleSummaryFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  GetArticleSummaryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BookmarkApi
      RouteKey: GET /article-summary
      AuthorizationType: NONE
      Target: !Sub integrations/${GetArticleSummaryIntegration}

  GetArticleSummaryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetArticleSummaryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BookmarkApi}/*/*/article-summary

Outputs:
  BookmarkApiUrl:
    Description: Base URL for the bookmark API
    Value: !GetAtt BookmarkApi.ApiEndpoint
  TableName:
    Description: DynamoDB bookmarks table name
    Value: !Ref BookmarksTable
  FollowedCategoriesTableName:
    Description: DynamoDB followed categories table name
    Value: !Ref FollowedCategoriesTable
  ArticleSummariesTableName:
    Description: DynamoDB article summaries table name
    Value: !Ref ArticleSummariesTable
